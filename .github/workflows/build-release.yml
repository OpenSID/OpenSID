name: Build & Rilis OpenSID Premium

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Masukkan versi rilis, misal 2602.0.1. Format YYMM.minor.patch — patch mencerminkan total bug fix yang sudah digabung ke branch ini.'
        required: true
      prerelease:
        description: 'Rilis terbatas untuk pengujian — jika dicentang, update hanya di-push ke branch beta dan buat rilis sebagai pra-rilis.'
        type: boolean
        default: false

permissions:
  contents: write

# ════════════════════════════════════════════════════════════════════
# JOB 1 — prepare
#   Validasi versi & tentukan routing push (dev/main).
#   Hasilnya dipakai oleh job build-and-publish.
# ════════════════════════════════════════════════════════════════════
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag:            ${{ steps.version.outputs.tag }}
      push_dev:       ${{ steps.routing.outputs.push_dev }}
      push_main:      ${{ steps.routing.outputs.push_main }}
      create_release: ${{ steps.routing.outputs.create_release }}

    steps:

      # ── 1. Normalisasi & parse tag ──────────────────────────────
      - name: Parse version
        id: version
        run: |
          RAW="${{ inputs.version }}"
          TAG="v${RAW#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          NUMERIC="${TAG#v}"
          MINOR=$(echo "$NUMERIC" | awk -F'.' '{print $2}')
          PATCH=$(echo "$NUMERIC" | awk -F'.' '{print $3}')
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH"  >> $GITHUB_OUTPUT
          echo "Tag: $TAG | Minor: $MINOR | Patch: $PATCH"

          echo "### 🎯 Informasi Versi" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`$TAG\` (Minor: $MINOR, Patch: $PATCH)" >> $GITHUB_STEP_SUMMARY

      # ── 2. Validasi format tag ───────────────────────────────────
      #   Hanya memvalidasi FORMAT tag — tidak mengunci nama branch.
      #   Tim bebas membuat branch apapun (misal dari commit pembekuan)
      #   dan menjalankan workflow dari sana. Routing ditentukan murni
      #   dari format tag di langkah berikutnya.
      - name: Validasi format tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BRANCH="${{ github.ref_name }}"

          if ! echo "$TAG" | grep -qE '^v[0-9]{4}\.[0-9]+\.[0-9]+$'; then
            echo "❌ Format tag tidak valid: $TAG"
            echo "   Format yang benar: vYYMM.minor.patch (contoh: v2602.0.1)"
            exit 1
          fi

          echo "✅ Format tag valid: $TAG (dari branch: $BRANCH)"

      # ── 3. Tentukan routing push ────────────────────────────────
      #   Routing ditentukan murni dari format tag, bukan nama branch:
      #
      #   prerelease=true               → beta only  (override semua skenario)
      #   vYYMM.0.0  (minor=patch=0)    → beta + master  (rilis perdana awal bulan)
      #   vYYMM.0.x  (minor=0, patch>0) → master only  (hotfix/bug-fix)
      #   vYYMM.x.y  (minor>0)          → beta only  (fitur baru / minor update)
      - name: Tentukan routing push
        id: routing
        run: |
          BRANCH="${{ github.ref_name }}"
          MINOR="${{ steps.version.outputs.minor }}"
          PATCH="${{ steps.version.outputs.patch }}"
          PRERELEASE="${{ inputs.prerelease }}"
          TAG="${{ steps.version.outputs.tag }}"

          echo "### 🚀 Laporan Rilis OpenSID Premium" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Parameter | 🔍 Detail |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ **Versi (Tag)** | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 **Branch Sumber** | \`$BRANCH\` (Repo: \`premium\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 **Dieksekusi Oleh** | \`@${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📌 **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

          if [ "$PRERELEASE" = "true" ]; then
            echo "push_dev=true"        >> $GITHUB_OUTPUT
            echo "push_main=false"      >> $GITHUB_OUTPUT
            echo "create_release=true"  >> $GITHUB_OUTPUT
            echo "| 🎯 **Branch Tujuan** | \`beta\` (Repo: \`rilis-premium\`) |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚦 **Skenario** | Uji Coba Lapangan (Pra-rilis) |" >> $GITHUB_STEP_SUMMARY
          elif [ "$MINOR" = "0" ] && [ "$PATCH" = "0" ]; then
            echo "push_dev=true"        >> $GITHUB_OUTPUT
            echo "push_main=true"       >> $GITHUB_OUTPUT
            echo "create_release=true"  >> $GITHUB_OUTPUT
            echo "| 🎯 **Branch Tujuan** | \`beta\` & \`master\` (Repo: \`rilis-premium\`) |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚦 **Skenario** | Rilis Perdana Awal Bulan |" >> $GITHUB_STEP_SUMMARY
          elif [ "$MINOR" = "0" ] && [ "$PATCH" != "0" ]; then
            echo "push_dev=false"       >> $GITHUB_OUTPUT
            echo "push_main=true"       >> $GITHUB_OUTPUT
            echo "create_release=true"  >> $GITHUB_OUTPUT
            echo "| 🎯 **Branch Tujuan** | \`master\` (Repo: \`rilis-premium\`) |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚦 **Skenario** | Hotfix (Perbaikan Bug) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "push_dev=true"        >> $GITHUB_OUTPUT
            echo "push_main=false"      >> $GITHUB_OUTPUT
            echo "create_release=true"  >> $GITHUB_OUTPUT
            echo "| 🎯 **Branch Tujuan** | \`beta\` (Repo: \`rilis-premium\`) |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚦 **Skenario** | Minor/Patch Update (Fitur Baru) |" >> $GITHUB_STEP_SUMMARY
          fi


# ════════════════════════════════════════════════════════════════════
# JOB 2 — build-and-publish
#   Encode PHP 8.2 Legacy dengan --bundle menggunakan ioncube_encoder.sh
#   secara manual (tanpa GitHub Action wrapper).
#
#   Strategi perakitan output (tanpa perlu restore views):
#     1. cp -r source/    → output/   ← semua file termasuk views ada di sini
#     2. Encode source/X  → encoded/X (views di-ignore, tidak masuk encoded/)
#     3. cp -r encoded/X/ → output/X/  ← merge: PHP terenkripsi menimpa
#        yang lama, views dari langkah 1 tetap utuh
#
#   Tidak ada ZIP, tidak ada artifact Actions — push langsung ke branch.
# ════════════════════════════════════════════════════════════════════
  build-and-publish:
    needs: prepare
    runs-on: ubuntu-22.04

    steps:

      # ── 1. Checkout Premium Source ───────────────────────────────
      - name: Checkout Premium Source
        uses: actions/checkout@v4

      # ── 2. Export clean source via git archive ───────────────────
      - name: Export clean source
        run: |
          git archive HEAD --format=zip -o clean-source.zip
          unzip -q clean-source.zip -d source/

      # ── 3. Setup IonCube Encoder ─────────────────────────────────
      - name: Setup IonCube Encoder
        run: |
          curl -fsSL "${{ secrets.IONCUBE_DOWNLOAD_URL }}" -o ioncube.tar.gz
          tar -xzf ioncube.tar.gz
          ENCODER_DIR=$(find . -maxdepth 1 -type d -name "ioncube*" | head -1)
          ENCODER_SH="$PWD/$ENCODER_DIR/ioncube_encoder.sh"
          chmod +x "$ENCODER_SH"
          echo "ENCODER=$ENCODER_SH" >> $GITHUB_ENV
          echo "✅ IonCube Encoder siap: $ENCODER_SH"

      # ── 4. Aktivasi lisensi ──────────────────────────────────────
      - name: Aktivasi IonCube License
        run: ${{ env.ENCODER }} --activate

      # ── 5–9. Encode dengan --bundle PHP 8.2 Legacy ───────────────
      #   PHP 8.2 (legacy/v14) mencakup runtime PHP 8.2, 8.3, dan 8.4.
      #   Hasil encode disimpan di encoded/ yang terpisah dari source/,
      #   sehingga --replace-target tidak diperlukan (lihat docs 3.14.3).
      #   Folder views di-ignore di sini dan dipertahankan dari langkah
      #   perakitan output (tidak perlu restore manual).

      - name: Encode app/ (bundle PHP 8.2 Legacy)
        id: encode_app
        continue-on-error: true
        run: |
          ${{ env.ENCODER }} -L -82 -x86-64 \
            source/app -o encoded/app \
            --bundle --create-target \
            --no-doc-comments \
            --ignore 'View/Components/' \
            --optimize more --license-check auto

      - name: Encode bootstrap/ (bundle PHP 8.2 Legacy)
        id: encode_bootstrap
        continue-on-error: true
        run: |
          ${{ env.ENCODER }} -L -82 -x86-64 \
            source/bootstrap -o encoded/bootstrap \
            --bundle --create-target \
            --no-doc-comments \
            --optimize more --license-check auto

      - name: Encode config/ (bundle PHP 8.2 Legacy)
        id: encode_config
        continue-on-error: true
        run: |
          ${{ env.ENCODER }} -L -82 -x86-64 \
            source/config -o encoded/config \
            --bundle --create-target \
            --no-doc-comments \
            --optimize more --license-check auto

      - name: Encode donjo-app/ (bundle PHP 8.2 Legacy)
        id: encode_donjo_app
        continue-on-error: true
        run: |
          ${{ env.ENCODER }} -L -82 -x86-64 \
            source/donjo-app -o encoded/donjo-app \
            --bundle --create-target \
            --no-doc-comments \
            --ignore 'views/' \
            --optimize more --license-check auto

      - name: Encode Modules/ (bundle PHP 8.2 Legacy)
        id: encode_modules
        continue-on-error: true
        run: |
          ${{ env.ENCODER }} -L -82 -x86-64 \
            source/Modules -o encoded/Modules \
            --bundle --create-target \
            --no-doc-comments \
            --ignore 'Views/' --ignore 'views/' --ignore 'Resources/views/' \
            --optimize more --license-check auto

      # ── 10. Deaktivasi lisensi (selalu dijalankan) ───────────────
      #   Menggunakan if: always() agar lisensi pasti dilepas meski
      #   salah satu encode gagal.
      - name: Deaktivasi IonCube License
        if: always()
        run: ${{ env.ENCODER }} --deactivate

      # ── 11. Verifikasi semua encode berhasil ─────────────────────
      #   Baru gagalkan job di sini, setelah deaktivasi selesai.
      - name: Verifikasi encoding
        run: |
          FAILED=""
          [ "${{ steps.encode_app.outcome }}"       != "success" ] && FAILED="$FAILED encode_app"
          [ "${{ steps.encode_bootstrap.outcome }}" != "success" ] && FAILED="$FAILED encode_bootstrap"
          [ "${{ steps.encode_config.outcome }}"    != "success" ] && FAILED="$FAILED encode_config"
          [ "${{ steps.encode_donjo_app.outcome }}" != "success" ] && FAILED="$FAILED encode_donjo_app"
          [ "${{ steps.encode_modules.outcome }}"   != "success" ] && FAILED="$FAILED encode_modules"

          if [ -n "$FAILED" ]; then
            echo "❌ Encode gagal pada modul: $FAILED"
            echo "### ❌ Build Gagal" >> $GITHUB_STEP_SUMMARY
            echo "- Modul gagal: **$FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ Semua modul berhasil di-encode (IonCube Legacy PHP 8.2, Bundle)."
          echo "### 🛠️ Status Build" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Semua modul berhasil di-encode (IonCube Legacy PHP 8.2, Bundle)**" >> $GITHUB_STEP_SUMMARY

      # ── 12. Rakit output ─────────────────────────────────────────
      #   Salin seluruh source → output terlebih dahulu agar semua
      #   file non-PHP (views, aset, dll.) sudah ada di output.
      #   Kemudian timpa dengan hasil encode — file PHP terenkripsi
      #   menimpa yang lama, sedangkan views yang di-ignore saat
      #   encode TIDAK ada di encoded/ sehingga tetap utuh dari
      #   langkah copy di atas. Tidak perlu restore manual.
      - name: Rakit output
        run: |
          mkdir -p output/
          cp -r source/. output/
          cp -r encoded/app/.       output/app/
          cp -r encoded/bootstrap/. output/bootstrap/
          cp -r encoded/config/.    output/config/
          cp -r encoded/donjo-app/. output/donjo-app/
          cp -r encoded/Modules/.   output/Modules/

      # ── 13. Tambahkan VERSION ────────────────────────────────────
      - name: Tambahkan VERSION
        run: echo "${{ needs.prepare.outputs.tag }}" > output/VERSION

      # ── 14. Buat GitHub Release di repo premium ──────────────────
      #   Repo premium menyimpan referensi rilis clean-source.
      #   Tidak ada file lampiran — desa update via branch, bukan ZIP.
      - name: Buat GitHub Release di premium
        if: needs.prepare.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:         ${{ needs.prepare.outputs.tag }}
          name:             Rilis ${{ needs.prepare.outputs.tag }}
          body_path:        catatan_rilis.md
          prerelease:       true
          target_commitish: ${{ github.ref_name }}
          token:            ${{ secrets.GITHUB_TOKEN }}

      # ── 15. Checkout rilis-premium ───────────────────────────────
      - name: Checkout rilis-premium
        uses: actions/checkout@v4
        with:
          repository: OpenSID/rilis-premium
          token:      ${{ secrets.RILIS_PREMIUM_TOKEN }}
          path:       rilis-premium
          fetch-depth: 0

      # ── 16. Push ke rilis-premium/beta ───────────────────────────
      - name: Push ke rilis-premium/beta
        if: needs.prepare.outputs.push_dev == 'true'
        run: |
          cd rilis-premium
          git checkout beta

          find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete
          cp -r ../output/. .

          git config user.name  "OpenDesa Bot"
          git config user.email "bot@opendesa.id"
          git add -A
          git diff --staged --quiet || \
            git commit -m "rilis: ${{ needs.prepare.outputs.tag }}"

          git push origin beta

      # ── 17. Push ke rilis-premium/master ─────────────────────────
      - name: Push ke rilis-premium/master
        if: needs.prepare.outputs.push_main == 'true'
        run: |
          cd rilis-premium
          git checkout master

          find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete
          cp -r ../output/. .

          git config user.name  "OpenDesa Bot"
          git config user.email "bot@opendesa.id"
          git add -A
          git diff --staged --quiet || \
            git commit -m "rilis: ${{ needs.prepare.outputs.tag }}"

          git push origin master

      # ── 18. Buat GitHub Release di rilis-premium ─────────────────
      #   Identik dengan release di repo premium — tanpa file lampiran.
      #   Desa mendapatkan update lewat mekanisme pull dari branch,
      #   bukan dengan mengunduh ZIP dari halaman release.
      - name: Buat GitHub Release di rilis-premium
        if: needs.prepare.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:         ${{ needs.prepare.outputs.tag }}
          name:             Rilis ${{ needs.prepare.outputs.tag }}
          body_path:        catatan_rilis.md
          prerelease:       true
          target_commitish: ${{ needs.prepare.outputs.push_dev == 'true' && 'beta' || 'master' }}
          token:            ${{ secrets.RILIS_PREMIUM_TOKEN }}
          repository:       OpenSID/rilis-premium

      # ── 19. Ringkasan Publikasi ──────────────────────────────────
      - name: Ringkasan Publikasi
        run: |
          echo "### 🚀 Laporan Publikasi Distribusi Akhir" >> $GITHUB_STEP_SUMMARY
          echo "✅ Encode PHP 8.2 Legacy (Bundle) & sinkronisasi branch selesai." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Repo Tujuan | Branch Tujuan | Status PUSH Source |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.prepare.outputs.push_main }}" = "true" ]; then
            echo "| \`rilis-premium\` | \`master\` | ✅ Berhasil di-Push |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| \`rilis-premium\` | \`master\` | ❌ Diabaikan |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.prepare.outputs.push_dev }}" = "true" ]; then
            echo "| \`rilis-premium\` | \`beta\` | ✅ Berhasil di-Push |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| \`rilis-premium\` | \`beta\` | ❌ Diabaikan |" >> $GITHUB_STEP_SUMMARY
          fi