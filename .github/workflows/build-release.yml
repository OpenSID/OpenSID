name: Build & Rilis OpenSID Premium

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Masukkan versi rilis, misal 2602.0.1. Format YYMM.minor.patch — patch mencerminkan total bug fix yang sudah digabung ke branch ini.'
        required: true
      prerelease:
        description: 'Rilis terbatas untuk pengujian — jika dicentang, update hanya di-push ke branch beta dan buat rilis sebagai pra-rilis.'
        type: boolean
        default: false

permissions:
  contents: write

# ════════════════════════════════════════════════════════════════════
# JOB 1 — prepare
#   Validasi versi & tentukan routing push (dev/main).
#   Hasilnya dipakai oleh job build dan publish.
# ════════════════════════════════════════════════════════════════════
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag:            ${{ steps.version.outputs.tag }}
      push_dev:       ${{ steps.routing.outputs.push_dev }}
      push_main:      ${{ steps.routing.outputs.push_main }}
      create_release: ${{ steps.routing.outputs.create_release }}

    steps:

      # ── 1. Normalisasi & parse tag ──────────────────────────────
      - name: Parse version
        id: version
        run: |
          RAW="${{ inputs.version }}"
          TAG="v${RAW#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          NUMERIC="${TAG#v}"
          MINOR=$(echo "$NUMERIC" | awk -F'.' '{print $2}')
          PATCH=$(echo "$NUMERIC" | awk -F'.' '{print $3}')
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH"  >> $GITHUB_OUTPUT
          echo "Tag: $TAG | Minor: $MINOR | Patch: $PATCH"

          echo "### 🎯 Informasi Versi" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`$TAG\` (Minor: $MINOR, Patch: $PATCH)" >> $GITHUB_STEP_SUMMARY

      # ── 2. Validasi format + kesesuaian branch vs tag ───────────
      - name: Validasi tag vs branch
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          MINOR="${{ steps.version.outputs.minor }}"
          PATCH="${{ steps.version.outputs.patch }}"
          BRANCH="${{ github.ref_name }}"

          if ! echo "$TAG" | grep -qE '^v[0-9]{4}\.[0-9]+\.[0-9]+$'; then
            echo "❌ Format tag tidak valid: $TAG"
            echo "   Format yang benar: vYYMM.minor.patch (contoh: v2602.0.1)"
            exit 1
          fi

          if [ "$BRANCH" = "bug-fix" ]; then
            if [ "$MINOR" != "0" ]; then
              echo "❌ Dari branch bug-fix, minor harus 0. Dapat: $MINOR"
              exit 1
            fi
            if [ "$PATCH" = "0" ]; then
              echo "❌ Dari branch bug-fix, patch harus > 0."
              exit 1
            fi
          elif [ "$BRANCH" = "rilis-dev" ]; then
            if [ "$MINOR" = "0" ] && [ "$PATCH" != "0" ]; then
              echo "❌ Tag vYYMM.0.x (patch>0) harus dari branch bug-fix, bukan rilis-dev."
              exit 1
            fi
          else
            echo "❌ Workflow hanya boleh dijalankan dari branch bug-fix atau rilis-dev."
            exit 1
          fi

          echo "✅ Validasi berhasil: $TAG dari branch $BRANCH"

      # ── 3. Tentukan routing push ────────────────────────────────
      - name: Tentukan routing push
        id: routing
        run: |
          BRANCH="${{ github.ref_name }}"
          MINOR="${{ steps.version.outputs.minor }}"
          PATCH="${{ steps.version.outputs.patch }}"
          PRERELEASE="${{ inputs.prerelease }}"
          TAG="${{ steps.version.outputs.tag }}"

          echo "### 🚀 Laporan Rilis OpenSID Premium" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 Parameter | 🔍 Detail |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ **Versi (Tag)** | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 **Branch Sumber** | \`$BRANCH\` (Repo: \`premium\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 **Dieksekusi Oleh** | \`@${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📌 **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

          if [ "$PRERELEASE" = "true" ]; then
            echo "push_dev=true"   >> $GITHUB_OUTPUT
            echo "push_main=false" >> $GITHUB_OUTPUT
            echo "create_release=true" >> $GITHUB_OUTPUT
            echo "| 🎯 **Branch Tujuan** | \`beta\` (Repo: \`rilis-premium\`) |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚦 **Skenario** | Uji Coba Lapangan (Pra-rilis) |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BRANCH" = "bug-fix" ]; then
            echo "push_dev=false" >> $GITHUB_OUTPUT
            echo "push_main=true" >> $GITHUB_OUTPUT
            echo "create_release=true" >> $GITHUB_OUTPUT
            echo "| 🎯 **Branch Tujuan** | \`master\` (Repo: \`rilis-premium\`) |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚦 **Skenario** | Hotfix (Perbaikan Bug) |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BRANCH" = "rilis-dev" ]; then
            echo "push_dev=true" >> $GITHUB_OUTPUT
            echo "create_release=true" >> $GITHUB_OUTPUT
            if [ "$MINOR" = "0" ]; then
              echo "push_main=true" >> $GITHUB_OUTPUT
              echo "| 🎯 **Branch Tujuan** | \`beta\` & \`master\` (Repo: \`rilis-premium\`) |" >> $GITHUB_STEP_SUMMARY
              echo "| 🚦 **Skenario** | Rilis Perdana Awal Bulan |" >> $GITHUB_STEP_SUMMARY
            else
              echo "push_main=false" >> $GITHUB_OUTPUT
              echo "| 🎯 **Branch Tujuan** | \`beta\` (Repo: \`rilis-premium\`) |" >> $GITHUB_STEP_SUMMARY
              echo "| 🚦 **Skenario** | Minor/Patch Update (Fitur Baru) |" >> $GITHUB_STEP_SUMMARY
            fi
          fi


# ════════════════════════════════════════════════════════════════════
# JOB 2 — build  (matrix: php 8.1 / 8.2 / 8.3)
#   Encode paralel per versi PHP.
#   Output disimpan sebagai Actions artifact:
#     zip-php81 / zip-php82 / zip-php83  → dilampirkan ke 1 release
#     output-php81                       → untuk push branch beta/master
# ════════════════════════════════════════════════════════════════════
  build:
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false        # versi lain tetap jalan walau satu gagal
      max-parallel: 1         # Mencegah tabrakan lisensi / rate-limit IonCube Pro CI
      matrix:
        php_version: ['8.1', '8.2', '8.3']

    steps:

      # ── 4. Set label PHP ────────────────────────────────────────
      - name: Set PHP label
        id: php
        run: |
          LABEL="php$(echo '${{ matrix.php_version }}' | tr -d '.')"
          TAG="${{ needs.prepare.outputs.tag }}"
          echo "label=$LABEL"                                  >> $GITHUB_OUTPUT
          echo "zip_name=opensid-premium-${TAG}-${LABEL}.zip" >> $GITHUB_OUTPUT

      # ── 5. Checkout source ──────────────────────────────────────
      - name: Checkout Premium Source
        uses: actions/checkout@v4

      # ── 6. Export clean source via git archive ──────────────────
      - name: Export clean source
        run: |
          git archive HEAD --format=zip -o clean-source.zip
          unzip -q clean-source.zip -d source/

      # ── 7. Copy clean source sebagai base output ────────────────
      - name: Copy source ke output
        run: |
          mkdir -p output/
          cp -r source/. output/

      # ─────────────────────────────────────────────────────────────
      # ENCODE — php-target-version dari matrix
      # ─────────────────────────────────────────────────────────────

      - name: Encode app/ (PHP ${{ matrix.php_version }})
        id: encode_app
        continue-on-error: true
        uses: MuriloChianfa/ioncube-encoder-action@v3.0.1
        env:
          IONCUBE_DOWNLOAD_URL: ${{ secrets.IONCUBE_DOWNLOAD_URL || '' }}
        with:
          source: 'source/app'
          output: 'output/app'
          php-target-version: ${{ matrix.php_version }}
          encoder-version: 'legacy'
          optimize: 'more'
          replace-target: true
          trial: false
          ignore: 'View/Components/'

      - name: Encode bootstrap/ (PHP ${{ matrix.php_version }})
        id: encode_bootstrap
        continue-on-error: true
        uses: MuriloChianfa/ioncube-encoder-action@v3.0.1
        env:
          IONCUBE_DOWNLOAD_URL: ${{ secrets.IONCUBE_DOWNLOAD_URL || '' }}
        with:
          source: 'source/bootstrap'
          output: 'output/bootstrap'
          php-target-version: ${{ matrix.php_version }}
          encoder-version: 'legacy'
          optimize: 'more'
          replace-target: true
          trial: false

      - name: Encode config/ (PHP ${{ matrix.php_version }})
        id: encode_config
        continue-on-error: true
        uses: MuriloChianfa/ioncube-encoder-action@v3.0.1
        env:
          IONCUBE_DOWNLOAD_URL: ${{ secrets.IONCUBE_DOWNLOAD_URL || '' }}
        with:
          source: 'source/config'
          output: 'output/config'
          php-target-version: ${{ matrix.php_version }}
          encoder-version: 'legacy'
          optimize: 'more'
          replace-target: true
          trial: false

      - name: Encode donjo-app/ (PHP ${{ matrix.php_version }})
        id: encode_donjo_app
        continue-on-error: true
        uses: MuriloChianfa/ioncube-encoder-action@v3.0.1
        env:
          IONCUBE_DOWNLOAD_URL: ${{ secrets.IONCUBE_DOWNLOAD_URL || '' }}
        with:
          source: 'source/donjo-app'
          output: 'output/donjo-app'
          php-target-version: ${{ matrix.php_version }}
          encoder-version: 'legacy'
          optimize: 'more'
          replace-target: true
          trial: false
          ignore: 'views/'

      - name: Encode Modules/ (PHP ${{ matrix.php_version }})
        id: encode_modules
        continue-on-error: true
        uses: MuriloChianfa/ioncube-encoder-action@v3.0.1
        env:
          IONCUBE_DOWNLOAD_URL: ${{ secrets.IONCUBE_DOWNLOAD_URL || '' }}
        with:
          source: 'source/Modules'
          output: 'output/Modules'
          php-target-version: ${{ matrix.php_version }}
          encoder-version: 'legacy'
          optimize: 'more'
          replace-target: true
          trial: false
          ignore: |
            Views/
            views/
            Resources/views/

      - name: Pulihkan folder Views yang di-ignore
        run: |
          cd source
          find donjo-app Modules -type d -iname "views" -exec cp --parents -a {} ../output/ \;
          cp --parents -a app/View/Components ../output/ || true

      # ── 8. Verifikasi semua encode berhasil ─────────────────────
      - name: Verifikasi encode (PHP ${{ matrix.php_version }})
        run: |
          FAILED=""
          [ "${{ steps.encode_app.outcome }}"       != "success" ] && FAILED="$FAILED encode_app"
          [ "${{ steps.encode_bootstrap.outcome }}" != "success" ] && FAILED="$FAILED encode_bootstrap"
          [ "${{ steps.encode_config.outcome }}"    != "success" ] && FAILED="$FAILED encode_config"
          [ "${{ steps.encode_donjo_app.outcome }}" != "success" ] && FAILED="$FAILED encode_donjo_app"
          [ "${{ steps.encode_modules.outcome }}"   != "success" ] && FAILED="$FAILED encode_modules"

          if [ -n "$FAILED" ]; then
            echo "❌ [PHP ${{ matrix.php_version }}] Encode gagal:$FAILED"
            echo "### ❌ Build Gagal (PHP ${{ matrix.php_version }})" >> $GITHUB_STEP_SUMMARY
            echo "- Modul gagal: **$FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ [PHP ${{ matrix.php_version }}] Semua encode berhasil."
          echo "### 🛠️ Status Build (PHP ${{ matrix.php_version }})" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Semua modul berhasil di-encode (IonCube Legacy)**" >> $GITHUB_STEP_SUMMARY

      # ── 9. Tambahkan VERSION ────────────────────────────────────
      - name: Tambahkan VERSION
        run: |
          echo "${{ needs.prepare.outputs.tag }}-${{ steps.php.outputs.label }}" > output/VERSION

      # ── 10. Buat ZIP ────────────────────────────────────────────
      - name: Buat ZIP (PHP ${{ matrix.php_version }})
        run: |
          cd output
          zip -r "../${{ steps.php.outputs.zip_name }}" .
          echo "✅ ZIP: ${{ steps.php.outputs.zip_name }}"
          echo "- 📦 **File ZIP Output:** \`${{ steps.php.outputs.zip_name }}\` berhasil dibuat." >> $GITHUB_STEP_SUMMARY

      # ── 11. Upload ZIP sebagai Actions artifact ─────────────────
      #    Dikumpulkan di job publish untuk dilampirkan ke 1 release.
      - name: Upload ZIP artifact (PHP ${{ matrix.php_version }})
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ steps.php.outputs.label }}
          path: ${{ steps.php.outputs.zip_name }}
          retention-days: 1

      # ── 12. Upload raw output PHP 8.1 untuk push branch ─────────
      #    Hanya PHP 8.1 — branch beta/master diisi encode versi ini.
      #    PHP 8.2/8.3 tidak push branch; desa download ZIP-nya.
      - name: Upload output PHP 8.1 untuk branch push
        if: matrix.php_version == '8.1'
        uses: actions/upload-artifact@v4
        with:
          name: output-php81
          path: output/
          include-hidden-files: true
          retention-days: 1


# ════════════════════════════════════════════════════════════════════
# JOB 3 — publish
#   Berjalan setelah SEMUA matrix build selesai.
#   • Push branch beta/master dengan encode PHP 8.1
#   • Buat 1 release (tag tanpa suffix PHP) di premium & rilis-premium
#     yang menyertakan 3 ZIP asset sekaligus (php81, php82, php83)
# ════════════════════════════════════════════════════════════════════
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04

    steps:

      # ── 13. Download semua ZIP artifact ─────────────────────────
      - name: Download ZIP php81
        uses: actions/download-artifact@v4
        with:
          name: zip-php81
          path: zips/

      - name: Download ZIP php82
        uses: actions/download-artifact@v4
        with:
          name: zip-php82
          path: zips/

      - name: Download ZIP php83
        uses: actions/download-artifact@v4
        with:
          name: zip-php83
          path: zips/

      # ── 14. Download output PHP 8.1 untuk push branch ───────────
      - name: Download output PHP 8.1
        uses: actions/download-artifact@v4
        with:
          name: output-php81
          path: output-php81/

      # ── 15. Checkout source (untuk catatan_rilis.md) ─────────────
      - name: Checkout Premium Source
        uses: actions/checkout@v4
        with:
          path: source-repo

      # ── 16. Buat GitHub Release di repo premium ──────────────────
      #    Repo premium menyimpan referensi rilis untuk clean-source.
      #    Tidak perlu menyertakan file zip hasil encode.
      - name: Buat GitHub Release di premium
        if: needs.prepare.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:         ${{ needs.prepare.outputs.tag }}
          name:             Rilis ${{ needs.prepare.outputs.tag }}
          body_path:        source-repo/catatan_rilis.md
          prerelease:       true
          target_commitish: ${{ github.ref_name }}
          token:            ${{ secrets.GITHUB_TOKEN }}

      # ── 17. Checkout rilis-premium ───────────────────────────────
      - name: Checkout rilis-premium
        uses: actions/checkout@v4
        with:
          repository: OpenSID/rilis-premium
          token:      ${{ secrets.RILIS_PREMIUM_TOKEN }}
          path:       rilis-premium
          fetch-depth: 0

      # ── 18. Push ke rilis-premium/beta ────────────────────────────
      #    Konten: encode PHP 8.1 (versi kanonik di branch).
      #    PHP 8.2/8.3 tersedia via ZIP asset di halaman release.
      - name: Push ke rilis-premium/beta
        if: needs.prepare.outputs.push_dev == 'true'
        run: |
          cd rilis-premium
          git checkout beta

          find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete
          cp -r ../output-php81/. .

          git config user.name  "OpenDesa Bot"
          git config user.email "bot@opendesa.id"
          git add -A
          git diff --staged --quiet || \
            git commit -m "rilis: ${{ needs.prepare.outputs.tag }}"

          git push origin beta

      # ── 19. Push ke rilis-premium/master ───────────────────────────
      - name: Push ke rilis-premium/master
        if: needs.prepare.outputs.push_main == 'true'
        run: |
          cd rilis-premium
          git checkout master

          find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete
          cp -r ../output-php81/. .

          git config user.name  "OpenDesa Bot"
          git config user.email "bot@opendesa.id"
          git add -A
          git diff --staged --quiet || \
            git commit -m "rilis: ${{ needs.prepare.outputs.tag }}"

          git push origin master

      # ── 20. Buat GitHub Release di rilis-premium ─────────────────
      #    Identik dengan release di repo premium.
      #    Desa bisa download 3 pilihan ZIP dari halaman release.
      - name: Buat GitHub Release di rilis-premium
        if: needs.prepare.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:         ${{ needs.prepare.outputs.tag }}
          name:             Rilis ${{ needs.prepare.outputs.tag }}
          body_path:        source-repo/catatan_rilis.md
          prerelease:       true
          target_commitish: ${{ needs.prepare.outputs.push_dev == 'true' && 'beta' || 'master' }}
          token:            ${{ secrets.RILIS_PREMIUM_TOKEN }}
          repository:       OpenSID/rilis-premium
          files: |
            zips/opensid-premium-${{ needs.prepare.outputs.tag }}-php81.zip
            zips/opensid-premium-${{ needs.prepare.outputs.tag }}-php82.zip
            zips/opensid-premium-${{ needs.prepare.outputs.tag }}-php83.zip

      # ── 21. Ringkasan Publikasi ──────────────────────────────────
      - name: Ringkasan Publikasi
        run: |
          echo "### 🚀 Laporan Publikasi Distribusi Akhir" >> $GITHUB_STEP_SUMMARY
          echo "✅ Sinkronisasi kode (*clean source*, PHP 8.1) ke branch tujuan telah berhasil!" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.prepare.outputs.create_release }}" = "true" ]; then
            echo "✅ **3 File ZIP Terenkripsi** telah dilampirkan ke rilis GitHub." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Tanpa Rilis GitHub** (Hanya update branch \`beta\` untuk uji coba lapangan)." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Repo Tujuan | Branch Tujuan | Status PUSH Source |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.prepare.outputs.push_main }}" = "true" ]; then
            echo "| \`rilis-premium\` | \`master\` | ✅ Berhasil di-Push |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| \`rilis-premium\` | \`master\` | ❌ Diabaikan |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.prepare.outputs.push_dev }}" = "true" ]; then
            echo "| \`rilis-premium\` | \`beta\` | ✅ Berhasil di-Push |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| \`rilis-premium\` | \`beta\` | ❌ Diabaikan |" >> $GITHUB_STEP_SUMMARY
          fi

