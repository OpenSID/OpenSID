name: Deploy Premium Bug Fix with Ansible

on:
  pull_request:
    branches: [bug-fix]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-opensid-bug-fix
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    name: Deploy Premium Bug Fix to Development Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Ansible Code
        uses: actions/checkout@v4

      # Ambil URL issue langsung dari body PR
      - name: Extract Issue URL
        id: extract_issue
        run: |
          BODY="${{ github.event.pull_request.body }}"

          # Ambil URL dari section "Masalah Terkait" saja
          ISSUE_URL=$(echo "$BODY" \
            | sed -n '/## Masalah Terkait/,/## /p' \
            | grep -oE 'https://github.com/OpenSID/(OpenSID|premium)/issues/[0-9]+' \
            | head -1)

          if [ -z "$ISSUE_URL" ]; then
            ISSUE_URL="none"
          fi

          echo "url=$ISSUE_URL" >> $GITHUB_OUTPUT

      # Debug (opsional tapi berguna saat test)
      - name: Debug Extracted Issue
        run: |
          echo "Extracted Issue URL:"
          echo "${{ steps.extract_issue.outputs.url }}"

      # Deploy Ansible + kirim URL ke playbook telegram
      - name: Deploy via SSH using appleboy/ssh-action
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CICD_SERVER_IP }}
          username: ${{ secrets.CICD_SERVER_USER }}
          key: ${{ secrets.CICD_SERVER_PRIVATE_KEY }}
          port: ${{ secrets.CICD_SERVER_PORT }}
          script: |
            set -euo pipefail
            cd ${{ secrets.CICD_SERVER_PATH }}

            ISSUE_URL="${{ steps.extract_issue.outputs.url }}"

            echo "Using Issue URL: $ISSUE_URL"

            ansible-playbook -i inventories/production/inventory.yml playbooks/deploy-opensid-premium-dev.yml \
              --extra-vars "issue_url=$ISSUE_URL" \
              --limit "bugfixpremium.opendesa.id"
