name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/'))

    steps:
      - name: PR Agent Action
        uses: qodo-ai/pr-agent@v0.32

        env:
          # API
          OPENAI_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OPENAI_API_BASE: "https://ai.opendesa.id/v1"
          GITHUB_TOKEN: ${{ secrets.AI_TOKEN }}

          # Model
          CONFIG.MODEL: "openai/riview"
          CONFIG.MODEL_TURBO: "openai/riview"
          CONFIG.FALLBACK_MODELS: '["openai/riview"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "200000"

          # Bahasa
          CONFIG.RESPONSE_LANGUAGE: "id"

          # Review behaviour
          CONFIG.PR_REVIEWER.INLINE_CODE_COMMENTS: "true"
          CONFIG.PR_REVIEWER.NUM_CODE_SUGGESTIONS: "20"
          CONFIG.PR_REVIEWER.FOCUS_ONLY_ON_DIFF: "false"

          # Security review
          CONFIG.PR_REVIEWER.REQUIRE_SECURITY_REVIEW: "true"
          CONFIG.PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "true"
          CONFIG.PR_REVIEWER.REQUIRE_TESTS_REVIEW: "false"
          CONFIG.PR_REVIEWER.REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "false"

          # Nonaktifkan ticket analysis
          CONFIG.PR_REVIEWER.REQUIRE_TICKET_ANALYSIS_REVIEW: "false"
          pr_reviewer.require_ticket_analysis_review: "false"

          # Prompt audit kode
          CONFIG.PR_REVIEWER.EXTRA_INSTRUCTIONS: >
            PENTING:
            Tulis seluruh komentar review HANYA dalam Bahasa Indonesia.
            Jangan menggunakan Bahasa Inggris sama sekali.

            Anda adalah senior security engineer yang melakukan audit kode.

            Lakukan analisis mendalam terhadap perubahan kode
            dan temukan masalah berikut:

            BUG DAN LOGIKA:
            - bug logika
            - race condition
            - null pointer / undefined access
            - memory leak
            - infinite loop
            - error handling yang hilang
            - edge case yang tidak ditangani

            KEAMANAN:
            - SQL injection
            - XSS
            - CSRF
            - command injection
            - path traversal
            - authentication bypass
            - authorization bypass
            - insecure deserialization
            - hardcoded secret
            - broken access control

            Untuk setiap temuan:

            - Buat komentar INLINE pada baris kode yang bermasalah
            - Jelaskan penyebab masalah
            - Jelaskan dampak terhadap sistem
            - Jika memungkinkan jelaskan skenario eksploitasi
            - Berikan contoh perbaikan kode

            Gunakan format berikut:

            MASALAH:
            penjelasan bug atau celah keamanan

            DAMPAK:
            risiko atau efek terhadap sistem

            SARAN PERBAIKAN:
            contoh perbaikan kode atau pendekatan yang lebih aman

            Jangan membuat ringkasan panjang.
            Fokus pada komentar langsung di kode yang bermasalah.

          # Auto actions
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"

          GITHUB_ACTION_CONFIG.PR_ACTIONS: '[
            "opened",
            "reopened",
            "ready_for_review",
            "review_requested",
            "synchronize"
          ]'