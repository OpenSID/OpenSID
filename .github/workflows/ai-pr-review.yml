name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review'))

    steps:
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OPENAI_API_BASE: "https://ai.opendesa.id/v1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.MODEL: "riview"
          CONFIG.MODEL_TURBO: "riview"
          CONFIG.LANGUAGE: "id"
          CONFIG.PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: true
          CONFIG.PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: true
          CONFIG.PR_REVIEWER.REQUIRE_TESTS_REVIEW: true
          CONFIG.PR_REVIEWER.REQUIRE_SECURITY_REVIEW: true
          CONFIG.PR_REVIEWER.REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: true
